<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriz de Competências - Piloto UnB EP</title>
    
    <!-- 1. Design e Estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .recharts-tooltip-wrapper { z-index: 50; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        /* Modal Overlay */
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); }
    </style>
    
    <!-- 2. Bibliotecas -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.344.0",
            "recharts": "https://esm.sh/recharts@2.12.2?deps=react@18.2.0,react-dom@18.2.0"
        }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div id="root"></div>

    <!-- 3. LÓGICA -->
    <script type="text/babel" data-type="module">
        import React, { useState, useMemo, useRef, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            LayoutDashboard, Database, Link as LinkIcon, BarChart3, Download, Upload, 
            Plus, Trash2, AlertCircle, CheckCircle2, Search, FileSpreadsheet,
            Network, Grid3X3, Save, RefreshCw, RotateCcw, Github, Key
        } from 'lucide-react';
        import { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, 
            Cell, PieChart, Pie, Radar, RadarChart, PolarGrid, PolarAngleAxis, 
            PolarRadiusAxis, AreaChart, Area, Legend, Sankey
        } from 'recharts';

        // --- CONFIGURAÇÃO ---
        const CSV_FILENAME = 'dados_oficiais.csv';

        const DEFAULT_DISCIPLINES = [];
        const DEFAULT_ABETS = [
            { id: 'SO1', description: 'Identify, formulate, and solve complex engineering problems' },
            { id: 'SO2', description: 'Apply engineering design with constraints' },
            { id: 'SO3', description: 'Communicate effectively' },
            { id: 'SO4', description: 'Ethical and professional responsibilities' },
            { id: 'SO5', description: 'Teamwork and leadership' },
            { id: 'SO6', description: 'Experimentation and data analysis' },
            { id: 'SO7', description: 'Acquire and apply new knowledge (Lifelong learning)' }
        ];
        const DEFAULT_PPC = [
            { id: 'PPC-EP-01', description: 'Modelagem e resolução de problemas' },
            { id: 'PPC-EP-02', description: 'Projeto de sistemas produtivos' },
            { id: 'PPC-EP-03', description: 'Gestão econômica' },
            { id: 'PPC-EP-04', description: 'Gestão sustentável' },
            { id: 'PPC-EP-06', description: 'Análise de dados e experimentação' },
            { id: 'PPC-EP-07', description: 'Gestão da qualidade' }
        ];

        // --- COMPONENTES UI ---
        const SectionHeader = ({ title, description, action }) => (
            <div className="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4 bg-white p-4 rounded-lg border border-slate-100 shadow-sm">
                <div>
                    <h2 className="text-2xl font-bold text-slate-800">{title}</h2>
                    <p className="text-slate-500 text-sm">{description}</p>
                </div>
                {action}
            </div>
        );

        const Card = ({ title, value, subtext, icon: Icon, color = "blue" }) => (
            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-start justify-between hover:shadow-md transition-shadow">
                <div>
                    <p className="text-slate-500 text-sm font-medium mb-1">{title}</p>
                    <h3 className="text-3xl font-bold text-slate-800">{value}</h3>
                    {subtext && <p className="text-slate-400 text-xs mt-2">{subtext}</p>}
                </div>
                <div className={`p-3 rounded-lg bg-${color}-50 text-${color}-600`}>
                    {Icon && <Icon size={24} />}
                </div>
            </div>
        );

        // --- APP ---
        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [mappingSubTab, setMappingSubTab] = useState('abet');
            const [isLoading, setIsLoading] = useState(true);
            const [loadSource, setLoadSource] = useState(''); // 'github', 'local', 'cache'
            
            // Modal State
            const [showModal, setShowModal] = useState(false);
            const [ghConfig, setGhConfig] = useState({ owner: '', repo: '', token: '' });
            const [syncStatus, setSyncStatus] = useState('idle'); // idle, loading, success, error

            // Estados de Dados
            const [disciplines, setDisciplines] = useState([]);
            const [mappings, setMappings] = useState([]);
            const [abetSOs, setAbetSOs] = useState(DEFAULT_ABETS);
            const [ppcCompetencies, setPpcCompetencies] = useState(DEFAULT_PPC);

            const fileInputRef = useRef(null);
            const [newMapping, setNewMapping] = useState({ discipline: '', targetId: '', evidence: '', status: true });

            // --- LÓGICA DE AUTO-CARREGAMENTO ---
            useEffect(() => {
                const initData = async () => {
                    setIsLoading(true);
                    try {
                        // Tenta carregar credenciais salvas (exceto token por segurança)
                        const savedOwner = localStorage.getItem('gh_owner');
                        const savedRepo = localStorage.getItem('gh_repo');
                        if(savedOwner && savedRepo) setGhConfig(prev => ({...prev, owner: savedOwner, repo: savedRepo}));

                        // 1. Tenta buscar do GitHub (arquivo local/raw)
                        const response = await fetch(CSV_FILENAME);
                        if (response.ok) {
                            const text = await response.text();
                            processCSVData(text, 'github');
                        } else {
                            throw new Error("Arquivo local não encontrado");
                        }
                    } catch (err) {
                        console.log("Falha load auto:", err);
                        const localDisc = localStorage.getItem('unb_disciplines');
                        const localMap = localStorage.getItem('unb_mappings');
                        if (localDisc && localMap) {
                            setDisciplines(JSON.parse(localDisc));
                            setMappings(JSON.parse(localMap));
                            setLoadSource('cache');
                        } else {
                            setLoadSource('vazio');
                        }
                    } finally {
                        setIsLoading(false);
                    }
                };
                initData();
            }, []);

            // Cache Local
            useEffect(() => { if(disciplines.length > 0) localStorage.setItem('unb_disciplines', JSON.stringify(disciplines)); }, [disciplines]);
            useEffect(() => { if(mappings.length > 0) localStorage.setItem('unb_mappings', JSON.stringify(mappings)); }, [mappings]);

            // --- FUNÇÕES DE GITHUB API ---
            
            const generateCSVContent = () => {
                const header = "cod_disc,nome_disc,ementa,ppc_comp,abet_so,justificativa_abet\n";
                const rows = mappings.map(m => {
                    const disc = disciplines.find(d => d.code === m.discipline);
                    const discName = disc ? disc.name : "Desconhecida";
                    // Escapar aspas duplas para CSV válido
                    const escape = (txt) => txt ? txt.replace(/"/g, '""') : '';
                    return `"${m.discipline}","${escape(discName)}","","${m.ppc || ''}","${m.abet || ''}","${escape(m.evidence)}"\n`;
                }).join(""); 
                return header + rows;
            };

            const saveToGitHub = async () => {
                if (!ghConfig.owner || !ghConfig.repo || !ghConfig.token) {
                    alert("Preencha todos os campos de configuração do GitHub.");
                    return;
                }

                setSyncStatus('loading');
                try {
                    const content = generateCSVContent();
                    const contentEncoded = btoa(unescape(encodeURIComponent(content)));
                    const apiUrl = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${CSV_FILENAME}`;
                    
                    const getResponse = await fetch(apiUrl, {
                        headers: { 
                            'Authorization': `token ${ghConfig.token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });

                    let sha = null;
                    if (getResponse.ok) {
                        const getData = await getResponse.json();
                        sha = getData.sha;
                    }

                    const body = {
                        message: `Atualização via WebApp Matriz (${new Date().toLocaleString()})`,
                        content: contentEncoded,
                        branch: 'main'
                    };
                    if (sha) body.sha = sha;

                    const putResponse = await fetch(apiUrl, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${ghConfig.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body)
                    });

                    if (putResponse.ok) {
                        setSyncStatus('success');
                        localStorage.setItem('gh_owner', ghConfig.owner);
                        localStorage.setItem('gh_repo', ghConfig.repo);
                        setTimeout(() => { setShowModal(false); setSyncStatus('idle'); }, 2000);
                        alert("Sucesso! Os dados foram salvos diretamente no repositório do GitHub.");
                    } else {
                        const errData = await putResponse.json();
                        throw new Error(errData.message || "Erro desconhecido");
                    }

                } catch (error) {
                    console.error(error);
                    setSyncStatus('error');
                    alert("Erro ao salvar no GitHub: " + error.message);
                }
            };

            // --- PARSERS CSV ---
            const parseCSVLine = (text) => {
                const result = [];
                let cell = '';
                let inQuotes = false;
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    if (char === '"') { inQuotes = !inQuotes; } 
                    else if (char === ',' && !inQuotes) { result.push(cell.trim()); cell = ''; } 
                    else { cell += char; }
                }
                result.push(cell.trim());
                return result;
            };

            const processCSVData = (csvText, source) => {
                try {
                    const lines = csvText.split('\n').filter(line => line.trim() !== '');
                    const newDisciplinesMap = new Map();
                    const newMappings = [];
                    
                    for (let i = 1; i < lines.length; i++) {
                        const row = parseCSVLine(lines[i]);
                        if (row.length >= 6) {
                            const code = row[0].replace(/^"|"$/g, '');
                            const name = row[1].replace(/^"|"$/g, '');
                            const ementa = row[2].replace(/^"|"$/g, '');
                            const ppc = row[3].replace(/^"|"$/g, '');
                            const abetRaw = row[4].replace(/^"|"$/g, '');
                            const justificativa = row[5].replace(/^"|"$/g, '');

                            if (!newDisciplinesMap.has(code)) {
                                newDisciplinesMap.set(code, { code, name, url: '#' });
                            }

                            const abetIdMatch = abetRaw.match(/(SO\d+)/);
                            const abetId = abetIdMatch ? abetIdMatch[0] : null;

                            if (code && (ppc || abetId)) {
                                newMappings.push({
                                    id: Date.now() + i,
                                    discipline: code,
                                    ppc: ppc || null,
                                    abet: abetId || null,
                                    evidence: justificativa || ementa,
                                    status: true,
                                    timestamp: new Date().toLocaleDateString('pt-BR')
                                });
                            }
                        }
                    }
                    const uniqueDisciplines = Array.from(newDisciplinesMap.values());
                    setDisciplines(uniqueDisciplines);
                    setMappings(newMappings);
                    setLoadSource(source);
                } catch (error) {
                    console.error(error);
                }
            };

            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => processCSVData(e.target.result, 'upload');
                reader.readAsText(file);
            };

            // --- CÁLCULOS ---
            const stats = useMemo(() => {
                const uniqueDisciplines = new Set(mappings.map(m => m.discipline)).size;
                const uniqueSOs = new Set(mappings.filter(m => m.abet).map(m => m.abet)).size;
                return {
                    mappedDisciplines: disciplines.length > 0 ? ((uniqueDisciplines / disciplines.length) * 100).toFixed(1) : 0,
                    mappedSOs: uniqueSOs,
                    totalMappings: mappings.length
                };
            }, [mappings, disciplines]);

            const sankeyData = useMemo(() => {
                const nodes = [];
                const links = [];
                disciplines.forEach(d => nodes.push({ name: d.code })); 
                ppcCompetencies.forEach(p => nodes.push({ name: p.id })); 
                abetSOs.forEach(a => nodes.push({ name: a.id })); 

                mappings.forEach(m => {
                    const srcIdx = nodes.findIndex(n => n.name === m.discipline);
                    if (m.ppc) {
                        const targetIdx = nodes.findIndex(n => n.name === m.ppc);
                        if (srcIdx > -1 && targetIdx > -1) {
                            const existing = links.find(l => l.source === srcIdx && l.target === targetIdx);
                            if (existing) existing.value++; else links.push({ source: srcIdx, target: targetIdx, value: 1 });
                        }
                    }
                    if (m.abet) {
                        const targetIdx = nodes.findIndex(n => n.name === m.abet);
                        if (srcIdx > -1 && targetIdx > -1) {
                            const existing = links.find(l => l.source === srcIdx && l.target === targetIdx);
                            if (existing) existing.value++; else links.push({ source: srcIdx, target: targetIdx, value: 1 });
                        }
                    }
                });
                // Retorna array vazio se não houver dados suficientes para evitar crash
                if (nodes.length === 0 || links.length === 0) return { nodes: [{name: 'Sem dados'}], links: [] };
                return { nodes, links };
            }, [mappings, disciplines, ppcCompetencies, abetSOs]);

            const chartDataABET = useMemo(() => abetSOs.map(so => {
                const count = new Set(mappings.filter(m => m.abet === so.id).map(m => m.discipline)).size;
                return { name: so.id, fullDesc: so.description, Cobertura: count, fullMark: 7 };
            }), [abetSOs, mappings]);

            // --- UI RENDERERS ---
            
            if (isLoading) return <div className="min-h-screen flex items-center justify-center bg-slate-50 text-slate-500">Carregando base de dados...</div>;

            const renderDashboard = () => (
                <div className="animate-fade-in space-y-6">
                    <div className="bg-white border-l-4 border-blue-500 p-4 shadow-sm rounded-r-lg flex justify-between items-center">
                        <div>
                            <p className="text-sm font-bold text-blue-700 uppercase">Fonte de Dados</p>
                            <p className="text-xs text-slate-500">
                                {loadSource === 'github' ? 'Conectado ao Repositório Oficial (GitHub)' : 
                                 loadSource === 'cache' ? 'Carregado da Memória Local (Cache)' : 'Base Vazia'}
                            </p>
                        </div>
                        <div className="flex gap-2">
                            {loadSource === 'github' && <div className="flex items-center gap-2 text-green-600 text-xs font-bold bg-green-50 px-3 py-1 rounded-full"><Github size={14}/> Sincronizado</div>}
                            <button onClick={() => setShowModal(true)} className="flex items-center gap-2 bg-slate-800 text-white text-xs font-bold px-3 py-1 rounded-full hover:bg-slate-900"><Upload size={14}/> Sincronizar Nuvem</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <Card title="% Disciplinas Mapeadas" value={`${stats.mappedDisciplines}%`} subtext="Do total cadastrado" icon={LinkIcon} color="blue" />
                        <Card title="# SOs Cobertos" value={`${stats.mappedSOs} / 7`} subtext="Student Outcomes ABET" icon={CheckCircle2} color="green" />
                        <Card title="Total de Vínculos" value={stats.totalMappings} subtext="Evidências registradas" icon={Database} color="purple" />
                        <Card title="Clareza Percebida" value="Alta" subtext="Baseada em evidências" icon={AlertCircle} color="orange" />
                    </div>
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                        <h3 className="text-lg font-bold text-slate-800 mb-4">Perfil de Cobertura (Radar ABET)</h3>
                        <div className="h-80">
                            <ResponsiveContainer width="100%" height="100%">
                                <RadarChart cx="50%" cy="50%" outerRadius="80%" data={chartDataABET}>
                                    <PolarGrid stroke="#e2e8f0" />
                                    <PolarAngleAxis dataKey="name" tick={{ fill: '#64748b', fontSize: 12 }} />
                                    <PolarRadiusAxis angle={30} domain={[0, 'auto']} tick={false} />
                                    <Radar name="Cobertura" dataKey="Cobertura" stroke="#3b82f6" fill="#3b82f6" fillOpacity={0.5} />
                                    <Tooltip />
                                </RadarChart>
                            </ResponsiveContainer>
                        </div>
                    </div>
                </div>
            );

            const renderAdvanced = () => (
                <div className="animate-fade-in">
                    <SectionHeader title="Visualizações Avançadas" description="Diagramas de fluxo e densidade." action={<div className="text-sm text-purple-600 bg-purple-50 px-3 py-1 rounded-full border border-purple-100 font-medium">Acreditação</div>} />
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 mb-8">
                        <h3 className="font-bold text-slate-800 mb-2 flex items-center gap-2"><Network size={20} className="text-blue-500"/> Fluxo Curricular (Sankey)</h3>
                        {sankeyData.links.length > 0 ? (
                            <div className="h-[500px] w-full"><ResponsiveContainer width="100%" height="100%"><Sankey data={sankeyData} node={{ fill: '#64748b' }} nodePadding={50} margin={{ left: 10, right: 10, top: 10, bottom: 10 }} link={{ stroke: '#cbd5e1' }}><Tooltip /></Sankey></ResponsiveContainer></div>
                        ) : (
                            <div className="h-64 flex items-center justify-center text-slate-400 italic">Sem dados suficientes para gerar o gráfico Sankey. Adicione mais mapeamentos.</div>
                        )}
                    </div>
                </div>
            );

            const renderMapping = () => (
                <div className="animate-fade-in">
                    <SectionHeader title="Mapeamento" description="Vincule disciplinas a competências." 
                        action={<button onClick={() => setShowModal(true)} className="flex items-center gap-2 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm font-medium shadow-sm"><Upload size={16} /> Salvar no GitHub</button>} 
                    />
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 mb-8">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <select className="p-2 border rounded" value={newMapping.discipline} onChange={e => setNewMapping({...newMapping, discipline: e.target.value})}><option value="">Selecione Disciplina...</option>{disciplines.map(d => <option key={d.code} value={d.code}>{d.code} - {d.name}</option>)}</select>
                            <select className="p-2 border rounded" value={newMapping.targetId} onChange={e => setNewMapping({...newMapping, targetId: e.target.value})}><option value="">Selecione Competência...</option>{mappingSubTab === 'abet' ? abetSOs.map(s => <option key={s.id} value={s.id}>{s.id}</option>) : ppcCompetencies.map(p => <option key={p.id} value={p.id}>{p.id}</option>)}</select>
                        </div>
                        <textarea className="w-full p-2 border rounded mb-4" placeholder="Evidência / Justificativa..." value={newMapping.evidence} onChange={e => setNewMapping({...newMapping, evidence: e.target.value})}></textarea>
                        <button onClick={() => {
                            if(!newMapping.discipline || !newMapping.targetId) return alert("Preencha tudo");
                            setMappings([...mappings, { id: Date.now(), discipline: newMapping.discipline, ppc: mappingSubTab === 'ppc' ? newMapping.targetId : null, abet: mappingSubTab === 'abet' ? newMapping.targetId : null, evidence: newMapping.evidence, timestamp: 'Hoje', status: true }]);
                            setNewMapping({ discipline: '', targetId: '', evidence: '', status: true });
                        }} className="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Adicionar (Memória Local)</button>
                    </div>
                    <div className="bg-white rounded-xl border border-slate-100 overflow-hidden">
                        <table className="w-full text-left text-sm">
                            <thead className="bg-slate-50 text-slate-700 font-semibold"><tr><th className="p-4">Disciplina</th><th className="p-4">Vínculo</th><th className="p-4">Evidência</th><th className="p-4 text-right">Ações</th></tr></thead>
                            <tbody className="divide-y divide-slate-100">
                                {mappings.map(m => (
                                    <tr key={m.id} className="hover:bg-slate-50">
                                        <td className="p-4 font-medium">{m.discipline}</td>
                                        <td className="p-4"><span className={`px-2 py-1 rounded text-xs font-bold ${m.abet ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}`}>{m.abet || m.ppc}</span></td>
                                        <td className="p-4 text-slate-500 truncate max-w-xs" title={m.evidence}>{m.evidence}</td>
                                        <td className="p-4 text-right"><button onClick={() => setMappings(mappings.filter(x => x.id !== m.id))} className="text-red-500 hover:text-red-700"><Trash2 size={16} /></button></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );

            const renderCatalog = () => (
                <div className="animate-fade-in">
                    <SectionHeader title="Base de Dados" description="Gerencie a fonte de dados." action={<div className="text-slate-400"><Database size={24}/></div>} />
                    <div className="bg-blue-50 border border-blue-200 rounded-xl p-8 text-center mb-8">
                        <h3 className="text-xl font-bold text-blue-900 mb-2">Atualização Manual (Local)</h3>
                        <p className="text-blue-700 mb-6 max-w-md mx-auto">Se não tiver acesso ao token do GitHub, carregue o arquivo localmente.</p>
                        <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept=".csv" className="hidden" />
                        <button onClick={() => fileInputRef.current.click()} className="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700 shadow-lg">Carregar Arquivo Local</button>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col md:flex-row relative">
                    {/* MODAL GITHUB */}
                    {showModal && (
                        <div className="fixed inset-0 modal-overlay flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-xl shadow-2xl max-w-md w-full p-6">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2"><Github size={20}/> Salvar no GitHub</h3>
                                    <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                                </div>
                                <p className="text-sm text-slate-500 mb-4">Para atualizar a base oficial, você precisa de permissão de escrita (Personal Access Token).</p>
                                
                                <div className="space-y-3 mb-6">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Usuário do GitHub</label>
                                        <input type="text" className="w-full border rounded p-2 text-sm" placeholder="ex: fastphoenixx" value={ghConfig.owner} onChange={e => setGhConfig({...ghConfig, owner: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Nome do Repositório</label>
                                        <input type="text" className="w-full border rounded p-2 text-sm" placeholder="ex: matriz-competencias-unb" value={ghConfig.repo} onChange={e => setGhConfig({...ghConfig, repo: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Token de Acesso (PAT)</label>
                                        <input type="password" className="w-full border rounded p-2 text-sm" placeholder="ghp_xxxxxxxxxxxx" value={ghConfig.token} onChange={e => setGhConfig({...ghConfig, token: e.target.value})} />
                                        <p className="text-[10px] text-slate-400 mt-1">O token deve ter permissão 'repo'. Não será salvo permanentemente.</p>
                                    </div>
                                </div>

                                <button onClick={saveToGitHub} disabled={syncStatus === 'loading'} className="w-full bg-slate-800 text-white py-2 rounded-lg font-bold hover:bg-slate-900 flex justify-center items-center gap-2">
                                    {syncStatus === 'loading' ? <RefreshCw size={16} className="animate-spin"/> : <Upload size={16}/>}
                                    {syncStatus === 'loading' ? 'Enviando...' : 'Confirmar Upload'}
                                </button>
                            </div>
                        </div>
                    )}

                    <aside className="w-full md:w-64 bg-white border-r border-slate-200 flex-shrink-0">
                        <div className="p-6 border-b border-slate-100"><h1 className="text-xl font-bold text-blue-600 flex items-center gap-2"><div className="w-8 h-8 bg-blue-600 text-white rounded-lg flex items-center justify-center text-sm">MC</div> Matriz UnB</h1><p className="text-xs text-slate-400 mt-1">Piloto Eng. Produção</p></div>
                        <nav className="p-4 space-y-1">
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors ${activeTab === 'dashboard' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'}`}><LayoutDashboard size={18} /> Dashboard</button>
                            <button onClick={() => setActiveTab('mapping')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors ${activeTab === 'mapping' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'}`}><LinkIcon size={18} /> Mapeamento</button>
                            <button onClick={() => setActiveTab('advanced')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors ${activeTab === 'advanced' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'}`}><Network size={18} /> Visualizações (Adv)</button>
                            <button onClick={() => setActiveTab('catalog')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors ${activeTab === 'catalog' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'}`}><Database size={18} /> Base de Dados</button>
                        </nav>
                    </aside>
                    <main className="flex-1 p-8 overflow-y-auto">
                        {activeTab === 'dashboard' && renderDashboard()}
                        {activeTab === 'mapping' && renderMapping()}
                        {activeTab === 'advanced' && renderAdvanced()}
                        {activeTab === 'catalog' && renderCatalog()}
                    </main>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
